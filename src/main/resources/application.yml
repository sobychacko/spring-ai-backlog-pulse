server:
  # Railway (and most PaaS) inject PORT; default stays 8080 locally
  port: ${PORT:8080}

spring:
  application:
    name: backlog-pulse
  web:
    resources:
      cache:
        cachecontrol:
          # Revalidate static resources on every load (ETag/304 — cheap). Without this,
          # browsers heuristically cache index.html and keep serving the previous UI after
          # a deploy; the SPA bundle is content-hashed anyway, so correctness beats caching.
          no-cache: true
  datasource:
    url: jdbc:postgresql://localhost:5432/pulse
    username: pulse
    password: pulse
    hikari:
      # Let the pool drain when idle: no idle connections ⇒ no background packets, so a
      # serverless deployment (Railway "sleep after 10 min without outbound traffic") can
      # actually go to sleep. First request after idle pays one connection open (~ms).
      minimum-idle: 0
      idle-timeout: 120000
  flyway:
    enabled: true
    baseline-on-migrate: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      pipeline:
    # daily refresh chain (POST /api/pipeline, kicked by the GitHub Actions cron):
    # duplicate-scan threshold + how many new items a run must embed before clusters rebuild
    scan-threshold: 0.75
    cluster-min-new-items: 10
  chat:
        options:
          model: claude-haiku-4-5
          max-tokens: 1024
    embedding:
      transformer:
        # all-mpnet-base-v2: 768-dim, much stronger semantic similarity than MiniLM-L6-v2.
        # First boot downloads ~420 MB and caches it; subsequent boots are instant.
        onnx:
          model-uri: https://huggingface.co/sentence-transformers/all-mpnet-base-v2/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/sentence-transformers/all-mpnet-base-v2/resolve/main/tokenizer.json
        cache:
          directory: ${user.home}/.cache/spring-ai
    vectorstore:
      pgvector:
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true

github:
  token: ${GITHUB_TOKEN:}
  repo: spring-projects/spring-ai
  api-base: https://api.github.com

pulse:
  # required on all non-GET /api requests (X-Admin-Token header) when set; empty = local
  # single-user mode with no guard. MUST be set for any deployment (e.g. Railway).
  admin:
    token: ${PULSE_ADMIN_TOKEN:}
  ingest:
    page-size: 100
  sync:
    # set true to enable the scheduled incremental sync (the hands-off "live" mode);
    # false = sync runs only manually via Admin → Sync / POST /api/sync
    scheduled: false
    initial-delay: 2m
    interval: 10m
  support:
    # branches out of OSS support; drives the Legacy Review tab (PR base-branch match is
    # deterministic, issue candidates are regex-gated then AI-assessed). 2.x-era EOLs are
    # a config change here, no code change.
    eol-branches:
      - 1.0.x
      - 1.1.x
  pipeline:
    # daily refresh chain (POST /api/pipeline, kicked by the GitHub Actions cron):
    # duplicate-scan threshold + how many new items a run must embed before clusters rebuild
    scan-threshold: 0.75
    cluster-min-new-items: 10
  chat:
    # MVP 9 "Ask the backlog". public=false ⇒ POST /api/chat needs the admin token like every
    # other POST; true ⇒ the one carve-out in AdminTokenFilter. Budget + rate limits apply in
    # BOTH modes (operator use spends the same budget). Defaults calibrated pre-deploy.
    public: false
    daily-budget-usd: 1.0
    questions-per-hour: 10
    max-concurrent: 3
  classify:
    concurrency: 8
    # ~2k tokens of body is plenty for classification signal (cost guard)
    max-body-chars: 8000
    # MVP 6: second-opinion model for the comparison workflow; dual-model gates whether
    # backfill/sync also classify with it automatically (manual POST /api/classify-sonnet otherwise)
    sonnet-model: claude-sonnet-4-6
    dual-model: false

logging:
  level:
    com.springai.pulse: INFO
