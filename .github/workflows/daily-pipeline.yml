# Kicks the app's daily refresh chain (sync → classify → embed → duplicate scan/adjudicate →
# legacy scan → gated cluster rebuild). The deployment is serverless: this request is what
# wakes it, so the first attempt may hit a cold boot (502) — hence the retry loop. Auth
# failures are deterministic and fail immediately instead of retrying.
#
# Required repository secrets:
#   PULSE_APP_URL      e.g. https://<app>.up.railway.app   (no trailing slash)
#   PULSE_ADMIN_TOKEN  the deployment's admin token
name: Daily pipeline

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC — 9am US Eastern in summer (8am after the DST switch)
  workflow_dispatch: {}     # manual runs from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline run
        run: |
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 60 -X POST \
              -H "X-Admin-Token: ${{ secrets.PULSE_ADMIN_TOKEN }}" \
              "${{ secrets.PULSE_APP_URL }}/api/pipeline") || code=000
            echo "attempt $attempt: HTTP $code"
            case "$code" in
              202) echo "pipeline started"; exit 0 ;;
              409) echo "a run is already in progress — treating as success"; exit 0 ;;
              401|403|404)
                echo "deterministic failure (check PULSE_APP_URL / PULSE_ADMIN_TOKEN secrets)"
                cat /tmp/body || true
                exit 1 ;;
            esac
            cat /tmp/body || true
            if [ "$attempt" -lt 4 ]; then
              sleep 45   # cold boot / transient — wait and retry
            fi
          done
          echo "pipeline trigger failed after 4 attempts"
          exit 1
